# Squid forward proxy of the mediator leg (run-mediator-leg.sh, cells M-4, M-5, M-6).
#
# Deny by default. The one allowed destination is the proxy-only Identus instance, which exists
# only on the leg's Docker network under the name identus-px, port 8080, with no host port: a
# client on the host can reach it only through this proxy. Plain HTTP (absolute-form requests)
# and CONNECT tunnels (the WebSocket cell) are both allowed there; everything else, 127.0.0.1
# included, gets 403 (the premise of M-6, checked before the cells run). None of squid's
# default rules (SSL_ports, Safe_ports, CONNECT restrictions) is present: the rules below are
# the whole policy.

http_port 3128
visible_hostname interop-squid

acl to_mediator dstdomain identus-px
acl mediator_port port 8080
http_access allow to_mediator mediator_port
http_access deny all

cache deny all
strip_query_terms off

# One line per request: time, client, method, URL (host:port for CONNECT), status, squid
# result code, bytes, User-Agent (tells the python counterpart's requests from the wallet's).
# Read by the leg with `docker exec … cat`; a CONNECT line is written when its tunnel closes.
# The log and spool directories are tmpfs mounts (the image declares them as volumes).
logformat harness %ts.%03tu %>a %rm %ru %>Hs %Ss %<st "%{User-Agent}>h"
access_log stdio:/var/log/squid/harness-access.log logformat=harness

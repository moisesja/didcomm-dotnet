name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true # didcomm-dotnet-fixtures (PRD §13.3)

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DidComm.sln

      - name: Build (warnings as errors — NFR-01)
        run: dotnet build DidComm.sln --configuration Release --no-restore /warnaserror

      - name: Test
        run: dotnet test DidComm.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      # Binary/API-compatibility gate: pack every publishable package so SDK Package Validation
      # (EnablePackageValidation, backed by ApiCompat) compares it against the last released version
      # on NuGet and fails the PR on any binary-incompatible change. Runs on Ubuntu only — the check
      # is platform-independent and packing once is sufficient.
      - name: Pack (API/binary compatibility gate)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack DidComm.sln --configuration Release --no-build

      # The pack-time check that internals-coupled packages pin each other exactly
      # (Directory.Build.targets) must also pass for a version with SemVer build metadata: NuGet
      # names the package by the normalized version, which drops the metadata. Packs one package
      # with two such dependencies; the Mediator ids run no package validation, so the version is
      # arbitrary. The step above is the ordinary-version control (PR #123 review).
      - name: Pack with a build-metadata version (exact-dependency check)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/DidComm.Mediator.AspNetCore/DidComm.Mediator.AspNetCore.csproj --configuration Release --no-build -p:DidCommVersion=1.0.0+ci.${{ github.run_number }} --output ${{ runner.temp }}/pack-build-metadata

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**/test-results.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

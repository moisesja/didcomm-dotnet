name: Release

# NFR-08: on a version tag, build + test + pack all publishable packages and push them to
# NuGet.org. Tag the release as `vMAJOR.MINOR.PATCH` (e.g. v0.1.0); the package version is
# derived from the tag, overriding the dev-default DidCommVersion in Directory.Build.props.
#
# Publishing uses NuGet Trusted Publishing (OIDC), so no API key is stored. Prerequisite: a policy
# on nuget.org for owner moisesja, repository didcomm-dotnet, workflow file release.yml and
# environment nuget-release. Without it the login step fails and nothing is published.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  pack:
    name: build + test + pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # didcomm-dotnet-fixtures (PRD §13.3)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: version
        # Strip the leading 'v': refs/tags/v0.1.0 -> GITHUB_REF_NAME=v0.1.0 -> 0.1.0.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore DidComm.sln

      - name: Build (warnings as errors — NFR-01)
        run: dotnet build DidComm.sln --configuration Release --no-restore /warnaserror -p:DidCommVersion=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test DidComm.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack DidComm.sln --configuration Release --no-build -p:DidCommVersion=${{ steps.version.outputs.version }} --output artifacts

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.*nupkg
          if-no-files-found: error

  publish:
    name: publish to NuGet
    needs: pack
    runs-on: ubuntu-latest
    # Gate the irreversible publish: the `nuget-release` environment's required reviewers approve
    # the tested packages before this job runs. The nuget.org policy names this environment, so a
    # token from anywhere else is refused.
    environment: nuget-release
    # The only job that can request a NuGet key. It never checks out the repo, so no project or
    # dependency code runs with this permission.
    permissions:
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: artifacts

      # Exchanges the GitHub OIDC token for a one-hour NuGet API key. Run immediately before the
      # push so the key cannot expire first.
      - name: NuGet login (OIDC → short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: moisesja # nuget.org profile name (the public package owner), not an email

      - name: Push to NuGet.org
        # Pushes the .nupkg files; the matching .snupkg symbol packages ride along automatically.
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
